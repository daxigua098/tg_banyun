app:
  name: tg-mirror-bot
  environment: development
  timezone: Asia/Shanghai

database:
  url: sqlite+aiosqlite:///./data/app.db
  echo: false

telegram:
  api_id: 0
  api_hash: ""
  phone: ""
  session_name: data/sessions/default
  proxy: null

management_bot:
  enabled: true
  token: ""
  admin_user_ids: []
  session_name: data/sessions/management_bot

transfer:
  mode: copy
  sequential: true
  delay_seconds: 1.0
  max_attempts: 5
  retry_base_seconds: 5
  worker_concurrency: 1

history:
  enabled: true
  default_limit: 500
  order: old_to_new
  skip_pinned: true

content_filter:
  media_only: true
  allow_photo: true
  allow_video: true

additional:
  enabled: false
  text: ""
  image_paths: []
  image_caption: ""

sync:
  edits: false
  deletes: false

ad_image:
  default_width: 1080
  default_height: 1080

backup:
  enabled: true
  interval_hours: 24
  retention_count: 7
  directory: backups

alerts:
  enabled: true
  notify_on_startup: true
  notify_on_failure: true
  notify_on_backup: true

web:
  host: 127.0.0.1
  port: 8000
  api_token: ""
  admin_username: admin
  admin_password: ""
  session_secret: ""
  session_hours: 24
  max_login_failures: 5
  login_window_minutes: 15
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

logging:
  level: INFO
  file: logs/app.log
