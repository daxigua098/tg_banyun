[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-mirror-bot"
version = "0.1.0"
description = "Sequential Telegram message mirroring MVP"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "asyncpg>=0.30.0",
  "loguru>=0.7.3",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "SQLAlchemy>=2.0.36",
  "Telethon>=1.39.0",
  "uvicorn[standard]>=0.34.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


[tool.ruff.lint.per-file-ignores]
'app/api/*.py' = ['B008']
